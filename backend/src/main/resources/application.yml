server:
  port: 8080

spring:
  application:
    name: nexus-server
  datasource:
    url: jdbc:h2:file:./data/nexus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

nexus:
  cors:
    # 前端 Vite 开发服务器地址，生产由 Nginx 反代时改环境变量覆盖
    allowed-origins: ${NEXUS_CORS_ORIGINS:http://localhost:5173}
  agent:
    # Python LangGraph 编排服务地址
    base-url: ${NEXUS_AGENT_BASE_URL:http://127.0.0.1:9001}
    # 每日总结定时触发 cron（默认每天 23:30）
    digest-cron: ${NEXUS_DIGEST_CRON:0 30 23 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.nexus: info
