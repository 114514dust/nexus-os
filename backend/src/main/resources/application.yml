server:
  port: 8080

spring:
  application:
    name: nexus-server
  datasource:
    url: jdbc:h2:file:./data/nexus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

nexus:
  cors:
    # 前端 Vite 开发服务器地址，生产由 Nginx 反代时改环境变量覆盖
    allowed-origins: ${NEXUS_CORS_ORIGINS:http://localhost:5173}
  agent:
    # Python LangGraph 编排服务地址
    base-url: ${NEXUS_AGENT_BASE_URL:http://127.0.0.1:9001}
    # 每日总结定时触发 cron（默认每天 23:30）
    digest-cron: ${NEXUS_DIGEST_CRON:0 30 23 * * *}
  feed:
    # 订阅抓取定时触发 cron（默认每 30 分钟）
    cron: ${NEXUS_FEED_CRON:0 */30 * * * *}
  job:
    # 求职面试提醒 cron（默认每天 9:00 检查今天/明天的面试与长期无进展的投递）
    reminder-cron: ${NEXUS_JOB_REMINDER_CRON:0 0 9 * * *}
  todo:
    # 待办到期提醒 cron（默认每天 8:30，早于求职提醒，让「今天的待办」排在「今天的面试」前面）
    reminder-cron: ${NEXUS_TODO_REMINDER_CRON:0 30 8 * * *}
  posting:
    # 校招岗位抓取 cron（默认每天 7:30，比待办/面试提醒都早）
    cron: ${NEXUS_POSTING_CRON:0 30 7 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.nexus: info
