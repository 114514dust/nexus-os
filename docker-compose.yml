services:
  nexus-agent:
    build: ./agent
    container_name: nexus-agent
    ports:
      - "9001:9001"
    environment:
      # LLM 兜底配置：优先走前端设置面板（存库后由 Java 透传），这里作为无 UI 场景的环境变量降级
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      # AI 对话操控组件时，反向调用 Java 后端（容器内用服务名访问）
      - NEXUS_BACKEND_BASE_URL=http://nexus-server:8080

  nexus-server:
    build: ./backend
    container_name: nexus-server
    ports:
      - "8080:8080"
    environment:
      - NEXUS_CORS_ORIGINS=http://localhost
      # 通过容器服务名访问 Agent，替代本机的 127.0.0.1
      - NEXUS_AGENT_BASE_URL=http://nexus-agent:9001
    depends_on:
      - nexus-agent
    volumes:
      - nexus-data:/app/data

  nexus-web:
    build: ./frontend
    container_name: nexus-web
    ports:
      - "80:80"
    depends_on:
      - nexus-server

volumes:
  nexus-data:
